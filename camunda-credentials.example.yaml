# Copy this file to camunda-credentials.yaml (same folder) and fill in the
# four values from Console -> cluster -> API -> client "outpass-app" -> Spring Boot tab.
# camunda-credentials.yaml is git-ignored; never commit the real secret.
camunda:
  client:
    auth:
      client-id: <client id>
      client-secret: <client secret>
    cloud:
      cluster-id: <cluster id>
      region: <region, e.g. bru-2>
